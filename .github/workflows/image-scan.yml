
# uses Trivy image scanner for CVEs - Docker Image
name: Image Scanner

on: 
    workflow_call:

jobs:
    image-scanner:
        runs-on: self-hosted

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKER_USER }}
                password: ${{ secrets.DOCKER_PASS }}
            
            - name: Trivy Scanner
              uses: aquasecurity/trivy-action@0.35.0
              with:
                image-ref: ${{ vars.DOCKER_USER }}/github-actions-app:${{ github.sha || github.run_id || github.ref }}
                severity: 'CRITICAL,HIGH'
                exit-code: '1'
                trivyignore: ${{ github.workspace }}/.trivyignore
