name : biren-webpage

on:
    workflow_dispatch:

jobs:
    biren-data:
        runs-on: self-hosted

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Login to dockerhub
              uses: docker/login-action@v3
              with:
                username: ${{vars.DOCKER_USER}}
                password: ${{secrets.DOCKER_PASS}}

            - name: Build & Push to Docker Hub
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                    ${{ vars.DOCKER_USER }}/github-actions-app:${{ github.ref_name }}
                    ${{ vars.DOCKER_USER }}/github-actions-app:latest
                    ${{ vars.DOCKER_USER }}/github-actions-app:${{ github.sha}}
                
            - name: Start the Web Server
              run: |
               # Stop old version if it's already there
                 docker stop my-web-app || true
                 docker rm my-web-app || true
                 # Start the new version
                 docker run -d --name my-web-app -p 8080:80 ${{ vars.DOCKER_USER }}/github-actions-app:latest

            
        