name : Docker Build & Push 

on:
    workflow_call:    # This option lets this workflow to be triggered (called) by another workflow.
    workflow_dispatch:  

jobs:
    biren-data:
        runs-on: self-hosted

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Login to dockerhub
              uses: docker/login-action@v3
              with:
                username: ${{vars.DOCKER_USER}}
                password: ${{secrets.DOCKER_PASS}}

            - name: Build & Push to Docker Hub
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                    ${{ vars.DOCKER_USER }}/github-actions-app:${{ github.ref_name }}
                    ${{ vars.DOCKER_USER }}/github-actions-app:latest
                    ${{ vars.DOCKER_USER }}/github-actions-app:${{ github.sha}}
              

            
        